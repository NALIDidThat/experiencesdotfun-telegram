openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Telegram and email identity
  - name: experiences
    description: Volunteering discovery and participation
  - name: profile
    description: Participant profile and rewards
  - name: host
    description: Host and organisation management
  - name: friends
    description: Lightweight social graph
  - name: community
    description: Group-scoped Community XP and reputation
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /bot/info:
    get:
      operationId: getBotInfo
      tags: [auth]
      summary: Get the public Telegram bot handle
      responses:
        "200":
          description: Telegram bot information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotInfo"
  /auth/telegram:
    post:
      operationId: authenticateTelegram
      tags: [auth]
      summary: Authenticate a Telegram Mini App user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramAuthInput"
      responses:
        "200":
          description: Authenticated Telegram user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/email/signup:
    post:
      operationId: signUpWithEmail
      tags: [auth]
      summary: Create an email account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailSignupInput"
      responses:
        "200":
          description: Created email account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/email/login:
    post:
      operationId: loginWithEmail
      tags: [auth]
      summary: Log in with an email account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailLoginInput"
      responses:
        "200":
          description: Authenticated email account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /me:
    get:
      operationId: getMe
      tags: [profile]
      summary: Get the current Telegram user's profile
      security: [{ telegramInitData: [] }]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      operationId: updateMe
      tags: [profile]
      summary: Update the current user's profile
      security: [{ telegramInitData: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdateInput"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /community/me:
    get:
      operationId: getMyCommunities
      tags: [community]
      summary: List Telegram groups where the current user has Community XP
      security: [{ telegramInitData: [] }]
      responses:
        "200":
          description: User's group memberships and Community XP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyCommunitiesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /community/{chatId}:
    get:
      operationId: getCommunityDetails
      tags: [community]
      summary: Get the current user's group reputation, leaderboard, and history
      security: [{ telegramInitData: [] }]
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: string
            pattern: "^-?[0-9]{1,20}$"
      responses:
        "200":
          description: Group-scoped reputation details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityDetails"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /experiences:
    get:
      operationId: listExperiences
      tags: [experiences]
      summary: Discover published volunteering experiences
      security: [{ telegramInitData: [] }]
      parameters:
        - $ref: "#/components/parameters/Category"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/AvailableOnly"
      responses:
        "200":
          description: Published experiences
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Experience"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createExperience
      tags: [host]
      summary: Publish a volunteering experience for the current organisation
      security: [{ telegramInitData: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExperienceCreateInput"
      responses:
        "201":
          description: Published experience
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Experience"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /experiences/{experienceId}:
    get:
      operationId: getExperience
      tags: [experiences]
      summary: Get experience details
      security: [{ telegramInitData: [] }]
      parameters:
        - $ref: "#/components/parameters/ExperienceId"
      responses:
        "200":
          description: Experience details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperienceDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /experiences/{experienceId}/join:
    post:
      operationId: joinExperience
      tags: [experiences]
      summary: Join a published experience
      security: [{ telegramInitData: [] }]
      parameters:
        - $ref: "#/components/parameters/ExperienceId"
      responses:
        "201":
          description: Participation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Participation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Cannot join this experience
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /participations:
    get:
      operationId: listMyParticipations
      tags: [experiences]
      summary: List the current user's participation history
      security: [{ telegramInitData: [] }]
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [upcoming, completed]
      responses:
        "200":
          description: Participation history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Participation"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /participations/{participationId}/submit:
    post:
      operationId: submitCompletion
      tags: [experiences]
      summary: Submit a completed experience for host verification
      security: [{ telegramInitData: [] }]
      parameters:
        - $ref: "#/components/parameters/ParticipationId"
      responses:
        "200":
          description: Updated participation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Participation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /host/overview:
    get:
      operationId: getHostOverview
      tags: [host]
      summary: Get organisation activity summary
      security: [{ telegramInitData: [] }]
      responses:
        "200":
          description: Host overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostOverview"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /host/experiences:
    get:
      operationId: listHostExperiences
      tags: [host]
      summary: List experiences owned by the current host
      security: [{ telegramInitData: [] }]
      responses:
        "200":
          description: Host experiences
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Experience"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /host/experiences/{experienceId}/participants:
    get:
      operationId: listExperienceParticipants
      tags: [host]
      summary: List participants for a hosted experience
      security: [{ telegramInitData: [] }]
      parameters:
        - $ref: "#/components/parameters/ExperienceId"
      responses:
        "200":
          description: Participants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Participation"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /host/participations/{participationId}/attend:
    post:
      operationId: markAttendance
      tags: [host]
      summary: Mark a participant as attended
      security: [{ telegramInitData: [] }]
      parameters:
        - $ref: "#/components/parameters/ParticipationId"
      responses:
        "200":
          description: Updated participation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Participation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /host/participations/{participationId}/verify:
    post:
      operationId: verifyParticipation
      tags: [host]
      summary: Verify a participant's submitted completion
      security: [{ telegramInitData: [] }]
      parameters:
        - $ref: "#/components/parameters/ParticipationId"
      responses:
        "200":
          description: Verified participation and issued reward
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Participation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /host/participations/{participationId}/reject:
    post:
      operationId: rejectParticipation
      tags: [host]
      summary: Reject a submitted completion
      security: [{ telegramInitData: [] }]
      parameters:
        - $ref: "#/components/parameters/ParticipationId"
      responses:
        "200":
          description: Rejected participation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Participation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /friends:
    get:
      operationId: listFriends
      tags: [friends]
      summary: List accepted friends
      security: [{ telegramInitData: [] }]
      responses:
        "200":
          description: Friends
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Friend"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /friends/requests:
    get:
      operationId: listFriendRequests
      tags: [friends]
      summary: List incoming friend requests
      security: [{ telegramInitData: [] }]
      responses:
        "200":
          description: Pending requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FriendRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createFriendRequest
      tags: [friends]
      summary: Send a friend request by Telegram username
      security: [{ telegramInitData: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FriendRequestCreateInput"
      responses:
        "201":
          description: Friend request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /friends/requests/sent:
    get:
      operationId: listSentFriendRequests
      tags: [friends]
      summary: List sent friend requests
      security: [{ telegramInitData: [] }]
      responses:
        "200":
          description: Sent pending requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FriendRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /friends/requests/{requestId}/accept:
    post:
      operationId: acceptFriendRequest
      tags: [friends]
      summary: Accept a friend request
      security: [{ telegramInitData: [] }]
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Accepted friend request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /friends/requests/{requestId}/decline:
    post:
      operationId: declineFriendRequest
      tags: [friends]
      summary: Decline a friend request
      security: [{ telegramInitData: [] }]
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Declined friend request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    telegramInitData:
      type: http
      scheme: bearer
      bearerFormat: TelegramWebAppInitData
  parameters:
    ExperienceId:
      name: experienceId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ParticipationId:
      name: participationId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    Category:
      name: category
      in: query
      schema:
        $ref: "#/components/schemas/ExperienceCategory"
    Search:
      name: search
      in: query
      schema:
        type: string
    AvailableOnly:
      name: availableOnly
      in: query
      schema:
        type: boolean
  responses:
    Unauthorized:
      description: Telegram identity is missing or invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Action cannot be completed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      properties:
        message:
          type: string
      required: [message]
    BotInfo:
      type: object
      properties:
        username:
          type: [string, "null"]
      required: [username]
    TelegramAuthInput:
      type: object
      properties:
        initData:
          type: string
          minLength: 1
      required: [initData]
    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        isNew:
          type: boolean
        sessionToken:
          type: [string, "null"]
      required: [user, isNew, sessionToken]
    EmailSignupInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
      required: [name, email, password]
    EmailLoginInput:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
      required: [email, password]
    ExperienceCategory:
      type: string
      enum: [environmental, education, community]
    ParticipationType:
      type: string
      enum: [join, host, both]
    ExperienceStatus:
      type: string
      enum: [published, full, completed, archived]
    ParticipationStatus:
      type: string
      enum: [joined, attended, submitted, verified, rejected]
    RewardStatus:
      type: string
      enum: [pending, issued]
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
        createdAt:
          type: [string, "null"]
          format: date-time
        telegramId:
          type: [integer, "null"]
          format: int64
        email:
          type: [string, "null"]
          format: email
        name:
          type: string
        username:
          type: [string, "null"]
        bio:
          type: [string, "null"]
        city:
          type: [string, "null"]
        country:
          type: [string, "null"]
        interests:
          type: array
          items:
            $ref: "#/components/schemas/ExperienceCategory"
        participationType:
          type: [string, "null"]
          allOf:
            - $ref: "#/components/schemas/ParticipationType"
        xp:
          type: integer
        level:
          type: string
        completedCount:
          type: integer
        hostedCount:
          type: integer
        rewardsPence:
          type: integer
      required:
        - id
        - createdAt
        - telegramId
        - email
        - name
        - username
        - bio
        - city
        - country
        - interests
        - participationType
        - xp
        - level
        - completedCount
        - hostedCount
        - rewardsPence
    ProfileUpdateInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        bio:
          type: [string, "null"]
        city:
          type: [string, "null"]
        country:
          type: [string, "null"]
        interests:
          type: array
          items:
            $ref: "#/components/schemas/ExperienceCategory"
        participationType:
          $ref: "#/components/schemas/ParticipationType"
      additionalProperties: false
    MyCommunitiesResponse:
      type: object
      properties:
        communities:
          type: array
          items:
            $ref: "#/components/schemas/CommunitySummary"
      required: [communities]
    CommunitySummary:
      type: object
      properties:
        chatId:
          type: string
        title:
          type: string
        communityXp:
          type: integer
        contributionCount:
          type: integer
        qualifyingMessages:
          type: integer
        rank:
          type: integer
        level:
          type: string
        levelProgress:
          type: number
        nextLevelXp:
          type: [integer, "null"]
      required:
        - chatId
        - title
        - communityXp
        - contributionCount
        - qualifyingMessages
        - rank
        - level
        - levelProgress
        - nextLevelXp
    CommunityLeaderboardMember:
      type: object
      properties:
        rank:
          type: integer
        name:
          type: string
        username:
          type: [string, "null"]
        communityXp:
          type: integer
        qualifyingMessages:
          type: integer
        level:
          type: string
        isCurrentUser:
          type: boolean
      required:
        - rank
        - name
        - username
        - communityXp
        - qualifyingMessages
        - level
        - isCurrentUser
    CommunityContribution:
      type: object
      properties:
        id:
          type: integer
        contributionType:
          type: string
          enum: [telegram_message, admin_reward]
        xpAwarded:
          type: integer
        createdAt:
          type: string
          format: date-time
      required: [id, contributionType, xpAwarded, createdAt]
    CommunityDetails:
      type: object
      properties:
        community:
          $ref: "#/components/schemas/CommunitySummary"
        leaderboard:
          type: array
          items:
            $ref: "#/components/schemas/CommunityLeaderboardMember"
        recentContributions:
          type: array
          items:
            $ref: "#/components/schemas/CommunityContribution"
      required: [community, leaderboard, recentContributions]
    Organisation:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: [string, "null"]
        city:
          type: [string, "null"]
        country:
          type: [string, "null"]
        categories:
          type: array
          items:
            $ref: "#/components/schemas/ExperienceCategory"
        verified:
          type: boolean
      required: [id, name, description, city, country, categories, verified]
    Experience:
      type: object
      properties:
        id:
          type: integer
        organisation:
          $ref: "#/components/schemas/Organisation"
        title:
          type: string
        description:
          type: string
        category:
          $ref: "#/components/schemas/ExperienceCategory"
        date:
          type: string
        startTime:
          type: string
        endTime:
          type: string
        location:
          type: string
        city:
          type: string
        capacity:
          type: integer
        participantCount:
          type: integer
        availablePlaces:
          type: integer
        xpReward:
          type: integer
        monetaryRewardPence:
          type: [integer, "null"]
        status:
          $ref: "#/components/schemas/ExperienceStatus"
      required:
        - id
        - organisation
        - title
        - description
        - category
        - date
        - startTime
        - endTime
        - location
        - city
        - capacity
        - participantCount
        - availablePlaces
        - xpReward
        - monetaryRewardPence
        - status
    ExperienceDetail:
      allOf:
        - $ref: "#/components/schemas/Experience"
        - type: object
          properties:
            whatToBring:
              type: [string, "null"]
            whatYouWillDo:
              type: [string, "null"]
            joined:
              type: boolean
            participation:
              anyOf:
                - $ref: "#/components/schemas/Participation"
                - type: "null"
          required: [whatToBring, whatYouWillDo, joined, participation]
    ExperienceCreateInput:
      type: object
      properties:
        organisationName:
          type: string
          minLength: 1
        organisationDescription:
          type: [string, "null"]
        title:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        category:
          $ref: "#/components/schemas/ExperienceCategory"
        date:
          type: string
        startTime:
          type: string
        endTime:
          type: string
        location:
          type: string
        city:
          type: string
        capacity:
          type: integer
          minimum: 1
        xpReward:
          type: integer
          minimum: 0
        monetaryRewardPence:
          type: [integer, "null"]
          minimum: 0
        whatToBring:
          type: [string, "null"]
        whatYouWillDo:
          type: [string, "null"]
      required:
        - organisationName
        - organisationDescription
        - title
        - description
        - category
        - date
        - startTime
        - endTime
        - location
        - city
        - capacity
        - xpReward
        - monetaryRewardPence
        - whatToBring
        - whatYouWillDo
    Participation:
      type: object
      properties:
        id:
          type: integer
        experience:
          $ref: "#/components/schemas/Experience"
        participant:
          $ref: "#/components/schemas/ParticipantSummary"
        status:
          $ref: "#/components/schemas/ParticipationStatus"
        joinedAt:
          type: string
          format: date-time
        attendedAt:
          type: [string, "null"]
          format: date-time
        submittedAt:
          type: [string, "null"]
          format: date-time
        verifiedAt:
          type: [string, "null"]
          format: date-time
        rewardStatus:
          $ref: "#/components/schemas/RewardStatus"
      required: [id, experience, participant, status, joinedAt, attendedAt, submittedAt, verifiedAt, rewardStatus]
    ParticipantSummary:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        username:
          type: [string, "null"]
      required: [id, name, username]
    HostOverview:
      type: object
      properties:
        organisation:
          anyOf:
            - $ref: "#/components/schemas/Organisation"
            - type: "null"
        upcomingExperiences:
          type: integer
        participantCount:
          type: integer
        pendingVerifications:
          type: integer
        totalExperiences:
          type: integer
      required: [organisation, upcomingExperiences, participantCount, pendingVerifications, totalExperiences]
    Friend:
      $ref: "#/components/schemas/ParticipantSummary"
    FriendRequest:
