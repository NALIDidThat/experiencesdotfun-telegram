openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Telegram and email identity
  - name: experiences
    description: Volunteering discovery and participation
  - name: profile
    description: Participant profile and rewards
  - name: accounts
    description: Profiles owned by the signed-in identity
  - name: host
    description: Host and organisation management
  - name: friends
    description: Lightweight social graph
  - name: community
    description: Group-scoped Community XP and reputation
  - name: socialFeed
    description: Privacy-aware activity feed, updates, reactions, and comments
  - name: messaging
    description: Profile-bound one-to-one direct messages
  - name: challenges
    description: Challenges between accepted friends
  - name: ai-assistant
    description: Persistent AI experience discovery conversations
paths:
  /challenges:
    get:
      operationId: listExperienceChallenges
      tags: [challenges]
      summary: List challenges involving the signed-in participant
      security: [{ telegramInitData: [] }]
      responses:
        "200":
          description: Challenges involving the signed-in participant
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExperienceChallenge"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createExperienceChallenge
      tags: [challenges]
      summary: Challenge an accepted friend to a published experience
      security: [{ telegramInitData: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExperienceChallengeCreateInput"
      responses:
        "201":
          description: Created challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperienceChallenge"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Only participant accounts can send challenges
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /challenges/{challengeId}/accept:
    post:
      operationId: acceptExperienceChallenge
      tags: [challenges]
      summary: Accept a challenge sent to the signed-in participant
      security: [{ telegramInitData: [] }]
      parameters:
        - name: challengeId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Accepted challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperienceChallenge"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /challenges/{challengeId}/decline:
    post:
      operationId: declineExperienceChallenge
      tags: [challenges]
      summary: Decline a challenge sent to the signed-in participant
      security: [{ telegramInitData: [] }]
      parameters:
        - name: challengeId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Declined challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperienceChallenge"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /ai/conversations:
    get:
      operationId: listAiAssistantConversations
      tags: [ai-assistant]
      summary: List conversations owned by the signed-in participant
      security: [{ telegramInitData: [] }]
      responses:
        "200":
          description: AI assistant conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AiAssistantConversationSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createAiAssistantConversation
      tags: [ai-assistant]
      summary: Create a persistent AI assistant conversation
      security: [{ telegramInitData: [] }]
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAssistantConversationSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /ai/conversations/{conversationId}:
    get:
      operationId: getAiAssistantConversation
      tags: [ai-assistant]
      summary: Get a conversation owned by the signed-in participant
      security: [{ telegramInitData: [] }]
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Conversation with message history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAssistantConversation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteAiAssistantConversation
      tags: [ai-assistant]
      summary: Delete a conversation owned by the signed-in participant
      security: [{ telegramInitData: [] }]
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "204":
          description: Conversation deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /ai/conversations/{conversationId}/messages:
    post:
      operationId: sendAiAssistantMessage
      tags: [ai-assistant]
      summary: Send a message and receive the assistant response as a stream
      security: [{ telegramInitData: [] }]
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiAssistantMessageInput"
      responses:
        "200":
          description: Streamed assistant response and action suggestions
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          description: Too many assistant messages in a short period
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Assistant is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /bot/info:
    get:
      operationId: getBotInfo
      tags: [auth]
      summary: Get the public Telegram bot handle
      responses:
        "200":
          description: Telegram bot information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotInfo"
  /auth/telegram:
    post:
      operationId: authenticateTelegram
      tags: [auth]
      summary: Authenticate or select a Telegram profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramAuthInput"
      responses:
        "200":
          description: Authenticated Telegram user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/email/signup:
    post:
      operationId: signUpWithEmail
      tags: [auth]
      summary: Create an email account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailSignupInput"
      responses:
        "200":
          description: Created and authenticated email account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "409":
          description: Email already registered or username already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Email sign-up is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/email/login:
    post:
      operationId: loginWithEmail
      tags: [auth]
      summary: Log in to an email account with an email address or username
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailLoginInput"
      responses:
        "200":
          description: Authenticated email account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /analytics/events:
    post:
      operationId: trackAnalyticsEvent
      tags: [profile]
      summary: Record a privacy-minimized app screen view
      security: [{ telegramInitData: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyticsEventInput"
      responses:
        "202":
          description: Event accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsEventAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /feed:
    get:
      operationId: getFeed
      tags: [socialFeed]
      summary: Get a privacy-filtered, cursor-paginated social feed
      security: [{ telegramInitData: [] }]
      parameters:
        - name: mode
          in: query
          schema:
            $ref: "#/components/schemas/FeedMode"
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 256
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Feed items visible to the current profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /feed/preferences:
    get:
      operationId: getFeedPreferences
      tags: [socialFeed]
      summary: Get the current profile's activity-sharing preference
      security: [{ telegramInitData: [] }]
      responses:
        "200":
          description: Current feed privacy preference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedPreferences"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      operationId: updateFeedPreferences
      tags: [socialFeed]
      summary: Change whether experience, verification, XP, and accountability check-in activity is shared with friends
      security: [{ telegramInitData: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFeedPreferencesInput"
      responses:
        "200":
          description: Updated feed privacy preference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedPreferences"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /posts:
    post:
      operationId: createFeedPost
      tags: [socialFeed]
      summary: Share a structured goal, doing, or thought update
      security: [{ telegramInitData: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFeedPostInput"
      responses:
        "201":
          description: Created update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /profiles/{profileId}/posts:
    get:
      operationId: getProfilePosts
      tags: [profile]
      summary: List posts visible to the current viewer on a profile
      security: [{ telegramInitData: [] }]
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Recent visible posts for the profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfilePostsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /posts/{postId}:
    get:
      operationId: getFeedItem
      tags: [socialFeed]
      summary: Get one visible feed item
      security: [{ telegramInitData: [] }]
      parameters:
        - $ref: "#/components/parameters/FeedItemId"
      responses:
        "200":
          description: Feed item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /posts/{postId}/reaction:
    put:
      operationId: setFeedReaction
      tags: [socialFeed]
      summary: Add or replace the signed-in profile's reaction
      security: [{ telegramInitData: [] }]
      parameters:
        - $ref: "#/components/parameters/FeedItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedReactionInput"
      responses:
        "200":
          description: Updated reaction summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedReactionState"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: removeFeedReaction
      tags: [socialFeed]
      summary: Remove the signed-in profile's reaction
      security: [{ telegramInitData: [] }]
      parameters:
        - $ref: "#/components/parameters/FeedItemId"
      responses:
        "200":
          description: Updated reaction summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedReactionState"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /posts/{postId}/comments:
    get:
      operationId: listFeedComments
      tags: [socialFeed]
      summary: List comments on a visible feed item
      security: [{ telegramInitData: [] }]
      parameters:
        - $ref: "#/components/parameters/FeedItemId"
      responses:
        "200":
          description: Comments in chronological order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedCommentsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createFeedComment
      tags: [socialFeed]
      summary: Comment on a visible feed item
      security: [{ telegramInitData: [] }]
      parameters:
        - $ref: "#/components/parameters/FeedItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedCommentInput"
      responses:
        "201":
          description: Created comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedComment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /comments/{commentId}:
    delete:
      operationId: deleteFeedComment
      tags: [socialFeed]
      summary: Delete the signed-in profile's own comment
      security: [{ telegramInitData: [] }]
      parameters:
        - $ref: "#/components/parameters/FeedCommentId"
      responses:
        "200":
          description: Comment deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedDeleteResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /accounts:
    get:
      operationId: listAccountProfiles
      tags: [accounts]
      summary: List profiles owned by the signed-in identity
      security: [{ telegramInitData: [] }]
      responses:
        "200":
          description: Profiles available under the current login
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountProfilesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createAccountProfile
      tags: [accounts]
      summary: Create a new profile under the signed-in identity
      security: [{ telegramInitData: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountProfileInput"
      responses:
        "201":
          description: New profile and its profile-bound session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /accounts/{accountId}/activate:
    post:
      operationId: activateAccountProfile
      tags: [accounts]
      summary: Activate one of the signed-in identity's profiles
      security: [{ telegramInitData: [] }]
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Selected profile and its profile-bound session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /me:
    get:
      operationId: getMe
      tags: [profile]
      summary: Get the current Telegram user's profile
      security: [{ telegramInitData: [] }]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      operationId: updateMe
      tags: [profile]
      summary: Update the current user's profile
      security: [{ telegramInitData: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdateInput"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /me/xp-awards:
    get:
      operationId: getMyXpAwards
      tags: [profile]
      summary: List Experience XP awards and pending balance
      security: [{ telegramInitData: [] }]
      responses:
        "200":
          description: Experience XP history and claimable amount
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/XpAwardsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /me/xp-awards/redeem:
    post:
      operationId: redeemMyXpAwards
      tags: [profile]
      summary: Redeem all pending Experience XP into the profile balance
      security: [{ telegramInitData: [] }]
      responses:
        "200":
          description: Redeemed amount and updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedeemXpAwardsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /community/me:
    get:
      operationId: getMyCommunities
      tags: [community]
      summary: List Telegram groups linked to the current user and their Community XP
      security: [{ telegramInitData: [] }]
      responses:
        "200":
          description: Verified group memberships and Community XP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyCommunitiesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: addMyCommunity
      tags: [community]
      summary: Verify and link a public Telegram group to the current profile
      security: [{ telegramInitData: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddCommunityInput"
      responses:
        "200":
          description: Group was already linked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunitySummary"
        "201":
          description: Group membership was verified and linked without awarding XP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunitySummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The current Telegram account is not a member of the group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Telegram membership could not be verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /community/{chatId}:
    get:
      operationId: getCommunityDetails
      tags: [community]
      summary: Get the current user's group reputation, leaderboard, and history
      security: [{ telegramInitData: [] }]
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: string
            pattern: "^-?[0-9]{1,20}$"
      responses:
        "200":
          description: Group-scoped reputation details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityDetails"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /explore/activity:
    get:
      operationId: listExploreActivity
      tags: [experiences]
      summary: Get recent host-verified activity aggregated by city
      security: [{ telegramInitData: [] }]
      responses:
        "200":
          description: Host-verified completion counts from the last 30 days, grouped by experience city. No participant identities or live check-ins are returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExploreActivityResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /experiences:
    get:
      operationId: listExperiences
      tags: [experiences]
      summary: Discover published volunteering experiences
      security: [{ telegramInitData: [] }]
      parameters:
        - $ref: "#/components/parameters/Category"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/AvailableOnly"
      responses:
        "200":
          description: Published experiences
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Experience"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createExperience
      tags: [host]
      summary: Publish a volunteering experience for the current organisation
      security: [{ telegramInitData: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExperienceCreateInput"
      responses:
        "201":
          description: Published experience
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Experience"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /experiences/{experienceId}:
    get:
      operationId: getExperience
      tags: [experiences]
      summary: Get experience details
      security: [{ telegramInitData: [] }]
      parameters:
        - $ref: "#/components/parameters/ExperienceId"
      responses:
        "200":
          description: Experience details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperienceDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /experiences/{experienceId}/join:
    post:
      operationId: joinExperience
      tags: [experiences]
      summary: Join a published experience or its waitlist when full
      security: [{ telegramInitData: [] }]
      parameters:
        - $ref: "#/components/parameters/ExperienceId"
      responses:
        "201":
          description: Participation or waitlist entry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Participation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Cannot join this experience
          content:
            application/json:
              schema:
