          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /accountability/invitations/{invitationId}/decline:
    post:
      operationId: declineAccountabilityInvitation
      tags: [friends]
      summary: Decline an accountability partnership invitation
      security: [{ telegramInitData: [] }]
      parameters:
        - $ref: "#/components/parameters/AccountabilityInvitationId"
      responses:
        "200":
          description: Invitation declined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountabilityMutationResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /accountability/partnerships/{partnershipId}/end:
    post:
      operationId: endAccountabilityPartnership
      tags: [friends]
      summary: End the signed-in participant's active partnership
      security: [{ telegramInitData: [] }]
      parameters:
        - $ref: "#/components/parameters/AccountabilityPartnershipId"
      responses:
        "200":
          description: Partnership ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountabilityMutationResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /accountability/commitments:
    post:
      operationId: createAccountabilityCommitment
      tags: [friends]
      summary: Create a shared commitment for an active partnership
      security: [{ telegramInitData: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountabilityCommitmentInput"
      responses:
        "201":
          description: Shared commitment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountabilityCommitment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /accountability/commitments/{commitmentId}/check-ins:
    post:
      operationId: createAccountabilityCheckIn
      tags: [friends]
      summary: Record a self-reported commitment check-in
      security: [{ telegramInitData: [] }]
      parameters:
        - $ref: "#/components/parameters/AccountabilityCommitmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountabilityCheckInInput"
      responses:
        "201":
          description: Check-in recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountabilityCheckIn"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /accountability/check-ins/{checkInId}/confirm:
    post:
      operationId: confirmAccountabilityCheckIn
      tags: [friends]
      summary: Confirm a partner's self-reported completion
      security: [{ telegramInitData: [] }]
      parameters:
        - $ref: "#/components/parameters/AccountabilityCheckInId"
      responses:
        "200":
          description: Check-in confirmed by partner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountabilityCheckIn"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /accountability/encouragement:
    post:
      operationId: sendAccountabilityEncouragement
      tags: [friends]
      summary: Send a prewritten or custom encouragement to the active partner
      security: [{ telegramInitData: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountabilityEncouragementInput"
      responses:
        "201":
          description: Encouragement sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountabilityMutationResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /accountability/notifications/{notificationId}/read:
    patch:
      operationId: markAccountabilityNotificationRead
      tags: [friends]
      summary: Mark an accountability notification as read
      security: [{ telegramInitData: [] }]
      parameters:
        - $ref: "#/components/parameters/AccountabilityNotificationId"
      responses:
        "200":
          description: Notification marked read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountabilityMutationResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    telegramInitData:
      type: http
      scheme: bearer
      bearerFormat: TelegramWebAppInitData
  parameters:
    DirectConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    ExperienceId:
      name: experienceId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ParticipationId:
      name: participationId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    AccountabilityInvitationId:
      name: invitationId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    AccountabilityPartnershipId:
      name: partnershipId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    OrganisationPartnershipId:
      name: partnershipId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    AccountabilityCommitmentId:
      name: commitmentId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    AccountabilityCheckInId:
      name: checkInId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    AccountabilityNotificationId:
      name: notificationId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    FeedItemId:
      name: postId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    FeedCommentId:
      name: commentId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    Category:
      name: category
      in: query
      schema:
        $ref: "#/components/schemas/ExperienceCategory"
    Search:
      name: search
      in: query
      schema:
        type: string
    AvailableOnly:
      name: availableOnly
      in: query
      schema:
        type: boolean
  responses:
    BadRequest:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Telegram identity is missing or invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Action cannot be completed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    DirectMessageProfile:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        username:
          type: [string, "null"]
        avatarUrl:
          type: [string, "null"]
        userType:
          oneOf:
            - $ref: "#/components/schemas/UserType"
            - type: "null"
      required: [id, name, username, avatarUrl, userType]
    DirectMessage:
      type: object
      properties:
        id:
          type: integer
        senderId:
          type: integer
        body:
          type: string
        createdAt:
          type: string
          format: date-time
        readAt:
          type: [string, "null"]
          format: date-time
      required: [id, senderId, body, createdAt, readAt]
    DirectConversation:
      type: object
      properties:
        id:
          type: integer
        otherUser:
          $ref: "#/components/schemas/DirectMessageProfile"
        lastMessage:
          oneOf:
            - $ref: "#/components/schemas/DirectMessage"
            - type: "null"
        lastMessageAt:
          type: [string, "null"]
          format: date-time
        unreadCount:
          type: integer
      required: [id, otherUser, lastMessage, lastMessageAt, unreadCount]
    DirectMessagesPage:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/DirectMessage"
        hasMore:
          type: boolean
      required: [messages, hasMore]
    DirectConversationInput:
      type: object
      properties:
        recipientId:
          type: integer
          minimum: 1
      required: [recipientId]
      additionalProperties: false
    DirectMessageInput:
      type: object
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: "\\S"
      required: [body]
      additionalProperties: false
    DirectMessageReadResponse:
      type: object
      properties:
        updatedCount:
          type: integer
      required: [updatedCount]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      properties:
        message:
          type: string
      required: [message]
    BotInfo:
      type: object
      properties:
        username:
          type: [string, "null"]
      required: [username]
    TelegramAuthInput:
      type: object
      properties:
        initData:
          type: string
          minLength: 1
          description: Signed Telegram Mini App data or a valid profile-bound Telegram session.
        userType:
          $ref: "#/components/schemas/UserType"
      required: [initData]
    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        isNew:
          type: boolean
        sessionToken:
          type: string
          minLength: 1
      required: [user, isNew, sessionToken]
    AccountProfilesResponse:
      type: object
      properties:
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/User"
      required: [accounts]
    CreateAccountProfileInput:
      type: object
      properties:
        userType:
          $ref: "#/components/schemas/UserType"
      required: [userType]
    EmailSignupInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          pattern: "\\S"
        username:
          type: string
          minLength: 5
          maxLength: 32
          pattern: "^[a-z0-9_]{5,32}$"
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        userType:
          $ref: "#/components/schemas/UserType"
      required: [name, username, email, password, userType]
    EmailLoginInput:
      type: object
      description: Supply exactly one of email or username, along with the password.
      properties:
        email:
          type: string
          format: email
          minLength: 1
        username:
          type: string
          pattern: "^@*[A-Za-z0-9_]{5,32}$"
          description: Public username, with optional leading @ characters.
        password:
          type: string
          minLength: 1
      required: [password]
    AnalyticsEventInput:
      type: object
      additionalProperties: false
      properties:
        screen:
          type: string
          enum: [home, explore, experiences, ai, challenges, profile, notifications, messages, direct-message, friends, friend-profile, experience, host, create, email]
        platform:
          type: string
          enum: [ios, android, web]
      required: [screen, platform]
    AnalyticsEventAccepted:
      type: object
      additionalProperties: false
      properties:
        accepted:
          type: boolean
      required: [accepted]
    ExperienceCategory:
      type: string
      enum: [environmental, education, community]
    ParticipationType:
      type: string
      enum: [join, host, both]
    UserType:
      type: string
      enum: [participant, organisation]
    ExperienceStatus:
      type: string
      enum: [published, full, completed, archived, cancelled]
    ParticipationStatus:
      type: string
      enum: [joined, attended, submitted, verified, rejected, waitlisted]
    RewardStatus:
      type: string
      enum: [pending, issued]
    SocialLinks:
      type: object
      properties:
        website:
          type: string
          minLength: 1
          format: uri
          pattern: "^https://"
        instagram:
          type: string
          minLength: 1
          format: uri
          pattern: "^https://"
        linkedin:
          type: string
          minLength: 1
          format: uri
          pattern: "^https://"
        x:
          type: string
          minLength: 1
          format: uri
          pattern: "^https://"
        youtube:
          type: string
          minLength: 1
          format: uri
          pattern: "^https://"
      additionalProperties: false
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
        createdAt:
          type: [string, "null"]
          format: date-time
        telegramId:
          type: [integer, "null"]
          format: int64
        email:
          type: [string, "null"]
          format: email
        name:
          type: string
        username:
          type: [string, "null"]
        avatarUrl:
          type: [string, "null"]
          format: uri
        bio:
          type: [string, "null"]
        city:
          type: [string, "null"]
        country:
          type: [string, "null"]
        socialLinks:
          $ref: "#/components/schemas/SocialLinks"
        interests:
          type: array
          items:
            $ref: "#/components/schemas/ExperienceCategory"
        participationType:
          type: [string, "null"]
          allOf:
            - $ref: "#/components/schemas/ParticipationType"
        userType:
          oneOf:
            - $ref: "#/components/schemas/UserType"
            - type: "null"
        organisation:
          type: [object, "null"]
          allOf:
            - $ref: "#/components/schemas/Organisation"
        xp:
          type: integer
        level:
          type: string
        completedCount:
          type: integer
        hostedCount:
          type: integer
        rewardsPence:
          type: integer
      required:
        - id
        - createdAt
        - telegramId
        - email
        - name
        - username
        - avatarUrl
        - bio
        - city
        - country
        - socialLinks
        - interests
        - participationType
        - userType
        - organisation
        - xp
        - level
        - completedCount
        - hostedCount
        - rewardsPence
    XpAward:
      type: object
      properties:
        id:
          type: string
        sourceType:
          type: string
          enum: [email_signup, experience, milestone, legacy_balance]
        sourceId:
          type: string
        title:
          type: string
        amount:
          type: integer
        status:
          type: string
          enum: [pending, redeemed]
        awardedAt:
          type: string
          format: date-time
      required: [id, sourceType, sourceId, title, amount, status, awardedAt]
    XpAwardsResponse:
      type: object
      properties:
        balanceXp:
          type: integer
          description: Experience XP already credited to the user's profile.
        pendingXp:
          type: integer
          description: Experience XP that is available to redeem.
        awards:
          type: array
          items:
            $ref: "#/components/schemas/XpAward"
      required: [balanceXp, pendingXp, awards]
    RedeemXpAwardsResponse:
      type: object
      properties:
        redeemedXp:
          type: integer
        user:
          $ref: "#/components/schemas/User"
      required: [redeemedXp, user]
    ProfileUpdateInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          pattern: "\\S"
        username:
          type: string
          minLength: 5
          maxLength: 32
          pattern: "^[A-Za-z0-9_]{5,32}$"
        bio:
          type: [string, "null"]
        city:
          type: [string, "null"]
        socialLinks:
          $ref: "#/components/schemas/SocialLinks"
        country:
          type: [string, "null"]
        interests:
          type: array
          items:
            $ref: "#/components/schemas/ExperienceCategory"
        participationType:
          $ref: "#/components/schemas/ParticipationType"
        userType:
          $ref: "#/components/schemas/UserType"
        organisation:
          $ref: "#/components/schemas/OrganisationProfileInput"
      additionalProperties: false
    MyCommunitiesResponse:
      type: object
      properties:
        communities:
          type: array
          items:
            $ref: "#/components/schemas/CommunitySummary"
      required: [communities]
    AddCommunityInput:
      type: object
      properties:
        group:
          type: string
          minLength: 1
          maxLength: 500
          description: Public Telegram group username or t.me link
      required: [group]
      additionalProperties: false
    CommunitySummary:
      type: object
      properties:
        chatId:
          type: string
        title:
          type: string
        communityXp:
          type: integer
        contributionCount:
          type: integer
        qualifyingMessages:
          type: integer
        rank:
          type: integer
        level:
          type: string
        levelProgress:
          type: number
        nextLevelXp:
          type: [integer, "null"]
      required:
        - chatId
        - title
        - communityXp
        - contributionCount
        - qualifyingMessages
        - rank
        - level
        - levelProgress
        - nextLevelXp
    CommunityLeaderboardMember:
      type: object
      properties:
        rank:
          type: integer
        name:
          type: string
        username:
          type: [string, "null"]
        communityXp:
          type: integer
        qualifyingMessages:
          type: integer
        level:
          type: string
        isCurrentUser:
          type: boolean
      required:
        - rank
        - name
        - username
        - communityXp
        - qualifyingMessages
        - level
        - isCurrentUser
    CommunityContribution:
      type: object
      properties:
        id:
          type: integer
        contributionType:
          type: string
          enum: [telegram_message, admin_reward]
        xpAwarded:
          type: integer
        createdAt:
          type: string
          format: date-time
      required: [id, contributionType, xpAwarded, createdAt]
    CommunityDetails:
      type: object
      properties:
        community:
          $ref: "#/components/schemas/CommunitySummary"
        leaderboard:
          type: array
          items:
            $ref: "#/components/schemas/CommunityLeaderboardMember"
        recentContributions:
          type: array
          items:
            $ref: "#/components/schemas/CommunityContribution"
      required: [community, leaderboard, recentContributions]
    Organisation:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: [string, "null"]
        city:
          type: [string, "null"]
        country:
          type: [string, "null"]
        categories:
          type: array
          items:
            $ref: "#/components/schemas/ExperienceCategory"
        verified:
          type: boolean
      required: [id, name, description, city, country, categories, verified]
    OrganisationProfileInput:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        description:
          type: string
          minLength: 10
          maxLength: 600
        city:
          type: string
          minLength: 2
          maxLength: 100
        categories:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ExperienceCategory"
      required: [name, description, city, categories]
      additionalProperties: false
    ExperienceMilestoneInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: [string, "null"]
          maxLength: 500
        xpReward:
          type: integer
          minimum: 0
      required: [title, description, xpReward]
      additionalProperties: false
    ExperienceMilestone:
      type: object
      properties:
        id:
          type: integer
        position:
          type: integer
        title:
          type: string
        description:
          type: [string, "null"]
        xpReward:
          type: integer
      required: [id, position, title, description, xpReward]
    ExperienceMilestoneProgress:
      allOf:
        - $ref: "#/components/schemas/ExperienceMilestone"
        - type: object
          properties:
            status:
              type: string
              enum: [not_started, submitted, verified, rejected]
            submittedAt:
              type: [string, "null"]
              format: date-time
            verifiedAt:
              type: [string, "null"]
              format: date-time
          required: [status, submittedAt, verifiedAt]
    ExperienceMilestoneSubmission:
      type: object
      properties:
        id:
          type: integer
        participationId:
          type: integer
        milestoneId:
          type: integer
        participant:
          $ref: "#/components/schemas/ParticipantSummary"
        milestoneTitle:
          type: string
        milestonePosition:
          type: integer
        xpReward:
          type: integer
        status:
          type: string
          enum: [submitted, verified, rejected]
        submittedAt:
          type: string
          format: date-time
        verifiedAt:
          type: [string, "null"]
          format: date-time
      required: [id, participationId, milestoneId, participant, milestoneTitle, milestonePosition, xpReward, status, submittedAt, verifiedAt]
    HostExperienceMilestonesResponse:
      type: object
      properties:
        milestones:
          type: array
          items:
            $ref: "#/components/schemas/ExperienceMilestone"
        submissions:
          type: array
          items:
            $ref: "#/components/schemas/ExperienceMilestoneSubmission"
        milestonesEditable:
          type: boolean
          description: False once any participant has submitted a milestone, so existing history cannot be changed.
      required: [milestones, submissions, milestonesEditable]
    ExperienceMilestoneReviewInput:
      type: object
      properties:
        action:
          type: string
          enum: [verify, reject]
      required: [action]
      additionalProperties: false
    Experience:
      type: object
      properties:
        id:
          type: integer
        organisation:
          $ref: "#/components/schemas/Organisation"
        title:
          type: string
        description:
          type: string
        category:
          $ref: "#/components/schemas/ExperienceCategory"
        date:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
        startTime:
          type: string
          pattern: "^(?:[01][0-9]|2[0-3]):[0-5][0-9]$"
        endTime:
          type: string
          pattern: "^(?:[01][0-9]|2[0-3]):[0-5][0-9]$"
        location:
          type: string
        city:
          type: string
        verifiedLocation:
          description: Present only when an organisation contact consented to public disclosure and a reviewer verified an official public listing. Coordinates are rounded according to precision; otherwise null.
          anyOf:
            - $ref: "#/components/schemas/VerifiedExperienceLocation"
            - type: "null"
        capacity:
          type: integer
        participantCount:
          type: integer
        availablePlaces:
          type: integer
        xpReward:
          type: integer
        monetaryRewardPence:
          type: [integer, "null"]
        status:
          $ref: "#/components/schemas/ExperienceStatus"
      required:
        - id
        - organisation
        - title
        - description
        - category
        - date
        - startTime
        - endTime
        - location
        - city
        - verifiedLocation
        - capacity
        - participantCount
        - availablePlaces
        - xpReward
        - monetaryRewardPence
        - status
    VerifiedExperienceLocation:
      type: object
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
          description: Latitude rounded to 1 decimal for city, 2 for neighborhood, or 3 for venue area.
        longitude:
          type: number
          minimum: -180
          maximum: 180
          description: Longitude rounded to the disclosed precision.
        precision:
          type: string
          enum: [city, neighborhood, venue_area]
        sourceType:
          type: string
          enum: [organisation_site, venue_site, public_partner_event]
        sourceUrl:
          type: string
          format: uri
          description: Public listing reviewed as evidence for this location.
        verifiedAt:
          type: string
          format: date-time
      required: [latitude, longitude, precision, sourceType, sourceUrl, verifiedAt]
    ExploreActivityCity:
      type: object
      properties:
        city:
          type: string
        verifiedCompletions:
          type: integer
          minimum: 1
          description: Host-verified completions recorded during the rolling 30-day window.
      required: [city, verifiedCompletions]
    ExploreActivityResponse:
      type: object
      properties:
        windowDays:
          type: integer
          enum: [30]
        cities:
          type: array
          items:
            $ref: "#/components/schemas/ExploreActivityCity"
      required: [windowDays, cities]
    ExperienceDetail:
      allOf:
        - $ref: "#/components/schemas/Experience"
        - type: object
          properties:
            whatToBring:
              type: [string, "null"]
            whatYouWillDo:
