components:
  securitySchemes:
    telegramInitData:
      type: http
      scheme: bearer
      bearerFormat: TelegramWebAppInitData
  parameters:
    DirectConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    ExperienceId:
      name: experienceId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ParticipationId:
      name: participationId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    AccountabilityInvitationId:
      name: invitationId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    AccountabilityPartnershipId:
      name: partnershipId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    OrganisationPartnershipId:
      name: partnershipId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    AccountabilityCommitmentId:
      name: commitmentId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    AccountabilityCheckInId:
      name: checkInId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    AccountabilityNotificationId:
      name: notificationId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    FeedItemId:
      name: postId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    FeedCommentId:
      name: commentId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    Category:
      name: category
      in: query
      schema:
        $ref: "#/components/schemas/ExperienceCategory"
    Search:
      name: search
      in: query
      schema:
        type: string
    AvailableOnly:
      name: availableOnly
      in: query
      schema:
        type: boolean
  responses:
    Forbidden:
      description: This profile cannot access this resource
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServiceUnavailable:
      description: Fundraising storage or Solana is temporarily unavailable
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Telegram identity is missing or invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Action cannot be completed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    FundPayoutInput:
      type: object
      required: [recipientUserId, walletAddress, amountSol, reason]
      properties:
        recipientUserId: { type: integer, minimum: 1 }
        walletAddress: { type: string }
        amountSol: { type: string }
        reason: { type: string, minLength: 5, maxLength: 300 }
        fundId: { type: integer, minimum: 1 }
    FundPayoutVerificationInput:
      type: object
      required: [signature]
      properties:
        signature: { type: string }
    FundPayout:
      type: object
      required: [id, recipientUserId, recipientName, organisationName, walletAddress, treasuryAddress, amountSol, reason, fundId, cluster, memo, status, signature, createdAt, paidAt, verificationMessage]
      properties:
        id: { type: string }
        recipientUserId: { type: integer }
        recipientName: { type: string }
        organisationName: { type: string }
        walletAddress: { type: string }
        treasuryAddress: { type: string }
        amountSol: { type: string }
        reason: { type: string }
        fundId: { type: [integer, "null"] }
        cluster: { type: string, enum: [mainnet-beta, devnet, testnet] }
        memo: { type: string }
        status: { type: string, enum: [proposed, cancelled, paid] }
        signature: { type: [string, "null"] }
        createdAt: { type: string }
        paidAt: { type: [string, "null"] }
        verificationMessage: { type: [string, "null"] }
    FundContributionInput:
      type: object
      required: [amountSol]
      properties:
        amountSol: { type: string, pattern: '^[0-9]+(\.[0-9]{1,9})?$' }
    FundCampaignActivityContribution:
      type: object
      required: [id, amountSol, confirmedAt]
      properties:
        id: { type: integer }
        amountSol: { type: string }
        confirmedAt: { type: string, format: date-time }
    FundCampaignTopSupporter:
      type: object
      required: [rank, amountSol, contributionCount]
      properties:
        rank: { type: integer }
        amountSol: { type: string }
        contributionCount: { type: integer }
    FundCampaignActivity:
      type: object
      required: [supporterWalletCount, recentContributions, topSupporters]
      properties:
        supporterWalletCount: { type: integer }
        recentContributions:
          type: array
          items: { $ref: "#/components/schemas/FundCampaignActivityContribution" }
        topSupporters:
          type: array
          items: { $ref: "#/components/schemas/FundCampaignTopSupporter" }
    CharityLedgerSyncInput:
      type: object
      properties:
        before: { type: string }
    OrganisationFundUpdateInput:
      type: object
      properties:
        title: { type: string, minLength: 3, maxLength: 80 }
        description: { type: string, minLength: 10, maxLength: 600 }
        goalSol: { type: number, exclusiveMinimum: 0, maximum: 1000000000 }
        status: { type: string, enum: [active, closed] }
    FundContribution:
      type: object
      required: [id, fundId, fundTitle, organisationName, amountSol, walletAddress, cluster, reference, paymentUri, status, signature, sender, createdAt, confirmedAt, lastCheckedAt, verificationMessage]
      properties:
        id: { type: string }
        fundId: { type: integer }
        fundTitle: { type: string }
        organisationName: { type: string }
        amountSol: { type: string }
        walletAddress: { type: string }
        cluster: { type: string, enum: [mainnet-beta, devnet, testnet] }
        reference: { type: string }
        paymentUri: { type: string }
        status: { type: string, enum: [pending, cancelled, confirmed] }
        signature: { type: [string, "null"] }
        sender: { type: [string, "null"] }
        createdAt: { type: string }
        confirmedAt: { type: [string, "null"] }
        lastCheckedAt: { type: [string, "null"] }
        verificationMessage: { type: [string, "null"] }
    CharityContributionLedgerEntry:
      type: object
      required: [id, fundId, fundTitle, amountSol, cluster, signature, sender, attribution, blockTime, recordedAt]
      properties:
        id: { type: integer }
        fundId: { type: [integer, "null"] }
        fundTitle: { type: [string, "null"] }
        amountSol: { type: string }
        cluster: { type: string, enum: [mainnet-beta, devnet, testnet] }
        signature: { type: string }
        sender: { type: string }
        attribution: { type: string, enum: [reference, memo, unattributed] }
        blockTime: { type: [string, "null"] }
        recordedAt: { type: string }
    CharityContributionLedger:
      type: object
      required: [entries, nextCursor, totalSol, unattributedSol, lastSyncedAt, historyComplete, historyCursor]
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/CharityContributionLedgerEntry" }
        nextCursor: { type: [integer, "null"] }
        totalSol: { type: string }
        unattributedSol: { type: string }
        lastSyncedAt: { type: [string, "null"] }
        historyComplete: { type: boolean }
        historyCursor: { type: [string, "null"] }
    CompaniesHouseSearchInput:
      type: object
      properties:
        query: { type: string, minLength: 2, maxLength: 120 }
      required: [query]
    CompaniesHouseSearchResult:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              registrationNumber: { type: string }
              status: { type: string }
              entityType: { type: string }
              incorporatedOn: { type: [string, "null"], format: date }
              registeredAddress:
                type: [object, "null"]
                properties:
                  locality: { type: [string, "null"] }
                  postalCode: { type: [string, "null"] }
                  country: { type: [string, "null"] }
            required: [name, registrationNumber, status, entityType, incorporatedOn, registeredAddress]
      required: [results]
    OrganisationVerificationApplicationInput:
      type: object
      properties:
        legalName: { type: string, minLength: 1, maxLength: 180 }
        organisationType: { type: string, minLength: 1, maxLength: 48 }
        jurisdiction: { type: string, minLength: 1, maxLength: 80 }
        registrationNumber: { type: [string, "null"], maxLength: 40 }
        website: { type: [string, "null"], format: uri }
        representativeName: { type: string, minLength: 1, maxLength: 120 }
        representativeRole: { type: string, minLength: 1, maxLength: 120 }
        contactEmail: { type: string, format: email, maxLength: 254 }
        evidenceObjectKeys:
          type: array
          maxItems: 5
          items: { type: string, maxLength: 200 }
      required: [legalName, organisationType, jurisdiction, representativeName, representativeRole, contactEmail]
    PrivateEvidenceUploadInput:
      type: object
      properties:
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
        data:
          type: string
          description: Base64-encoded image, at most 4 MB decoded
          maxLength: 5592406
      required: [contentType, data]
    PrivateEvidenceUploadResult:
      type: object
      properties:
        objectKey: { type: string }
      required: [objectKey]
    PrivateEvidenceAccessInput:
      type: object
      properties:
        objectKey: { type: string, maxLength: 200 }
      required: [objectKey]
    OrganisationVerificationDraftInput:
      type: object
      properties:
        legalName: { type: [string, "null"], maxLength: 180 }
        organisationType: { type: [string, "null"], maxLength: 48 }
        jurisdiction: { type: [string, "null"], maxLength: 80 }
        registrationNumber: { type: [string, "null"], maxLength: 40 }
        website: { type: [string, "null"], format: uri }
        representativeName: { type: [string, "null"], maxLength: 120 }
        representativeRole: { type: [string, "null"], maxLength: 120 }
        contactEmail: { type: [string, "null"], format: email, maxLength: 254 }
        evidenceObjectKeys:
          type: array
          maxItems: 5
          items: { type: string, maxLength: 200 }
      required: [legalName, organisationType, jurisdiction, registrationNumber, website, representativeName, representativeRole, contactEmail]
    OrganisationVerificationDraft:
      type: object
      properties:
        id: { type: integer }
        status: { type: string, enum: [draft] }
        savedAt: { type: string, format: date-time }
      required: [id, status, savedAt]
