openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Telegram and email identity
  - name: experiences
    description: Volunteering discovery and participation
  - name: profile
    description: Participant profile and rewards
  - name: memory-game
    description: Profile-bound memory game attempts, XP, and rankings
  - name: accounts
    description: Profiles owned by the signed-in identity
  - name: host
    description: Host and organisation management
  - name: friends
    description: Lightweight social graph
  - name: community
    description: Group-scoped Community XP and reputation
  - name: socialFeed
    description: Privacy-aware activity feed, updates, reactions, and comments
  - name: messaging
    description: Profile-bound one-to-one direct messages
  - name: challenges
    description: Challenges between accepted friends
  - name: ai-assistant
    description: Persistent AI experience discovery conversations
paths:
  /funds/payout-candidates:
    get:
      operationId: listCharityPayoutCandidates
      tags: [host]
      summary: Find participant profiles who have joined this charity's experiences
      security: [{ telegramInitData: [] }]
      responses:
        "200":
          description: Charity-scoped volunteer choices
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, name, username]
                  properties:
                    id: { type: integer }
                    name: { type: string }
                    username: { type: [string, "null"] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /funds/payouts:
    get:
      operationId: listFundPayouts
      tags: [host]
      summary: List owned charity payout proposals or payouts addressed to the signed-in participant
      security: [{ telegramInitData: [] }]
      parameters:
        - { name: before, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Profile-scoped payout records
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FundPayout" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createFundPayout
      tags: [host]
      summary: Record a volunteer payout proposal for external multisig approval; does not move funds
      security: [{ telegramInitData: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FundPayoutInput" }
      responses:
        "201":
          description: Proposal saved, not paid or approved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FundPayout" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /funds/payouts/{payoutId}/verify:
    post:
      operationId: verifyFundPayout
      tags: [host]
      summary: Verify a finalized treasury-to-recipient transfer with this proposal's memo
      security: [{ telegramInitData: [] }]
      parameters:
        - { name: payoutId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FundPayoutVerificationInput" }
      responses:
        "200":
          description: Verified paid payout or unchanged proposal with verification feedback
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FundPayout" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /funds/payouts/{payoutId}/cancel:
    post:
      operationId: cancelFundPayout
      tags: [host]
      summary: Dismiss an owned unpaid proposal; does not cancel an external multisig transaction
      security: [{ telegramInitData: [] }]
      parameters:
        - { name: payoutId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Current proposal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FundPayout" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /funds/contributions:
    get:
      operationId: listMyContributions
      tags: [host]
      summary: List payment requests and verified contributions for the signed-in profile
      security: [{ telegramInitData: [] }]
      parameters:
        - { name: before, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Private profile contribution history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FundContribution" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /funds/campaigns/{fundId}/activity/{period}:
    get:
      operationId: getFundCampaignActivity
      tags: [host]
      summary: List anonymous, verified campaign contributions and supporters for a period
      parameters:
        - { name: fundId, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { name: period, in: path, required: true, schema: { type: string, enum: [all, month] } }
      responses:
        "200":
          description: Recent verified contributions and anonymised supporter totals
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FundCampaignActivity" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /funds/campaigns/{fundId}/contributions:
    post:
      operationId: createFundContribution
      tags: [host]
      summary: Create or resume a profile-bound SOL payment request
      security: [{ telegramInitData: [] }]
      parameters:
        - { name: fundId, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FundContributionInput"
      responses:
        "201":
          description: Payment request; not evidence of payment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FundContribution" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /funds/contributions/{contributionId}/verify:
    post:
      operationId: verifyFundContribution
      tags: [host]
      summary: Find and verify a finalized payment using its unique reference
      security: [{ telegramInitData: [] }]
      parameters:
        - { name: contributionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Current contribution state; pending is not a confirmed payment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FundContribution" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /funds/contributions/{contributionId}/cancel:
    post:
      operationId: cancelFundContribution
      tags: [host]
      summary: Dismiss an unpaid request; this cannot cancel a blockchain transaction
      security: [{ telegramInitData: [] }]
      parameters:
        - { name: contributionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Current contribution state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FundContribution" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /funds/ledger:
    get:
      operationId: getCharityContributionLedger
      tags: [host]
      summary: Paginated persistent incoming SOL ledger for the signed-in charity
      security: [{ telegramInitData: [] }]
      parameters:
        - { name: before, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Persisted finalized transfers only
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CharityContributionLedger" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /funds/ledger/sync:
    post:
      operationId: syncCharityContributionLedger
      tags: [host]
      summary: Import one page of finalized incoming treasury transfers, including unattributed deposits
      security: [{ telegramInitData: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CharityLedgerSyncInput"
      responses:
        "200":
          description: Import result; cursor allows older history to be imported
          content:
            application/json:
              schema:
                type: object
                required: [imported, nextCursor, hasMore, checkedAt]
                properties:
                  imported: { type: integer }
                  nextCursor: { type: [string, "null"] }
                  hasMore: { type: boolean }
                  checkedAt: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /funds/campaigns/{fundId}:
    patch:
      operationId: updateOrganisationFund
      tags: [host]
      summary: Edit campaign details or goal, or close an owned campaign without removing its ledger
      security: [{ telegramInitData: [] }]
      parameters:
        - { name: fundId, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganisationFundUpdateInput"
      responses:
        "200":
          description: Campaign saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganisationFund" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /evidence/upload:
    post:
      operationId: uploadPrivateEvidence
      tags: [host]
      summary: Upload a private verification evidence image
      security: [{ telegramInitData: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrivateEvidenceUploadInput"
      responses:
        "201":
          description: Uploaded private evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivateEvidenceUploadResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/BadRequest" }
  /evidence/access:
    post:
      operationId: getPrivateEvidenceAccess
      tags: [host]
      summary: Get a short-lived private evidence URL after access checks
      security: [{ telegramInitData: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrivateEvidenceAccessInput"
      responses:
        "200":
          description: Short-lived evidence URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string, format: uri }
                  expiresIn: { type: integer }
                required: [url, expiresIn]
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Evidence is not attached to a record this profile may review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
  /organisations/verification/companies-house:
    post:
      operationId: searchCompaniesHouseForOrganisationVerification
      tags: [host]
      summary: Search Companies House records for an organisation verification application
      security: [{ telegramInitData: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompaniesHouseSearchInput"
      responses:
        "200":
          description: Sanitised Companies House results; a match does not verify applicant authority
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompaniesHouseSearchResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Organisation profile required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Search rate limit reached
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Companies House lookup is not configured or temporarily unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /organisations/verification:
    get:
      operationId: getOrganisationVerification
      tags: [host]
      summary: Get the signed-in organisation's verification status, latest application, and history
      security: [{ telegramInitData: [] }]
      responses:
        "200":
          description: Organisation verification status and application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganisationVerificationStatus"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Organisation profile required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
  /organisations/verification/draft:
    put:
      operationId: saveOrganisationVerificationDraft
      tags: [host]
      summary: Save progress on the signed-in organisation's verification application
      security: [{ telegramInitData: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganisationVerificationDraftInput"
      responses:
        "200":
          description: Saved verification draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganisationVerificationDraft"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Organisation profile required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /organisations/verification/applications:
    post:
      operationId: submitOrganisationVerificationApplication
      tags: [host]
      summary: Submit an organisation verification application
      security: [{ telegramInitData: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganisationVerificationApplicationInput"
      responses:
        "201":
          description: Submitted verification application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganisationVerificationSubmission"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Organisation profile required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /admin/organisation-verification/{applicationId}/review:
    post:
      operationId: reviewOrganisationVerificationApplication
      tags: [host]
      summary: Review an organisation verification application as the configured reviewer
      security: [{ telegramInitData: [] }]
      parameters:
        - name: applicationId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganisationVerificationReviewInput"
      responses:
        "200":
          description: Recorded review decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganisationVerificationReviewResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: This Telegram identity is not the configured reviewer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503":
          description: Verification review is not configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /admin/organisation-verification/applications:
    get:
      operationId: listOrganisationVerificationReviewQueue
      tags: [host]
      summary: List applications awaiting the configured reviewer's decision
      security: [{ telegramInitData: [] }]
      responses:
        "200":
          description: Verification applications visible only to the configured reviewer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrganisationVerificationReviewQueueItem"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: This Telegram identity is not the configured reviewer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Verification review is not configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /admin/organisation-verification/access:
    get:
      operationId: getOrganisationVerificationReviewAccess
      tags: [host]
      summary: Check whether the signed-in Telegram identity is the configured reviewer
      security: [{ telegramInitData: [] }]
      responses:
        "200":
          description: Review permission for the current identity only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganisationVerificationReviewAccess"
  /funds/treasury:
    get:
      operationId: getOrganisationTreasury
      tags: [host]
      summary: Get the signed-in charity treasury and finalized on-chain activity
      security: [{ telegramInitData: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 25, default: 20 }
        - name: before
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Charity treasury snapshot and recent finalized activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganisationTreasuryDashboard"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Only charity organisation profiles can view this treasury
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503":
          description: Solana RPC is unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    put:
      operationId: registerOrganisationTreasury
      tags: [host]
      summary: Register or update the signed-in charity's treasury address
      security: [{ telegramInitData: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganisationTreasuryInput"
      responses:
        "200":
          description: Registered charity treasury
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganisationTreasury"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Only charity organisation profiles can register a treasury
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503":
          description: The treasury could not be checked on Solana
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /funds:
    post:
      operationId: createOrganisationFund
      tags: [host]
      summary: Launch a SOL fundraiser using the signed-in charity's shared treasury
      security: [{ telegramInitData: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganisationFundCreateInput"
      responses:
        "201":
          description: Fund launched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganisationFund"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The profile cannot create this fund
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          $ref: "#/components/responses/Conflict"
  /funds/{organisationUserId}:
    get:
      operationId: listOrganisationFunds
      tags: [host]
      summary: List active and closed campaigns with recorded finalized contribution totals
      parameters:
        - name: organisationUserId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Public fund campaigns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrganisationFund"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /funds/{fundId}/milestones/{milestoneId}/outcome-reports:
    post:
      operationId: createFundMilestoneOutcomeReport
      tags: [host]
      summary: Record an append-only charity outcome update for a campaign checkpoint
      description: Outcome reports are charity-authored updates and do not change fundraising progress, verify delivery, or trigger payouts.
      security: [{ telegramInitData: [] }]
      parameters:
        - { name: fundId, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { name: milestoneId, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FundMilestoneOutcomeReportInput" }
      responses:
        "201":
          description: Charity outcome update recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FundMilestoneOutcomeReport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Campaign or checkpoint not found for the signed-in charity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /challenges:
    get:
      operationId: listExperienceChallenges
      tags: [challenges]
      summary: List challenges involving the signed-in participant
      security: [{ telegramInitData: [] }]
      responses:
        "200":
          description: Challenges involving the signed-in participant
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExperienceChallenge"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createExperienceChallenge
      tags: [challenges]
      summary: Challenge an accepted friend to a published experience
      security: [{ telegramInitData: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExperienceChallengeCreateInput"
      responses:
        "201":
          description: Created challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperienceChallenge"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Only participant accounts can send challenges
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /challenges/{challengeId}/accept:
    post:
      operationId: acceptExperienceChallenge
      tags: [challenges]
      summary: Accept a challenge sent to the signed-in participant
      security: [{ telegramInitData: [] }]
      parameters:
        - name: challengeId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Accepted challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperienceChallenge"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /challenges/{challengeId}/decline:
    post:
      operationId: declineExperienceChallenge
      tags: [challenges]
      summary: Decline a challenge sent to the signed-in participant
      security: [{ telegramInitData: [] }]
      parameters:
        - name: challengeId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Declined challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperienceChallenge"
        "401":
