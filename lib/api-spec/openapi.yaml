openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Telegram and email identity
  - name: experiences
    description: Volunteering discovery and participation
  - name: profile
    description: Participant profile and rewards
  - name: host
    description: Host and organisation management
  - name: friends
    description: Lightweight social graph
  - name: community
    description: Group-scoped Community XP and reputation
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /bot/info:
    get:
      operationId: getBotInfo
      tags: [auth]
      summary: Get the public Telegram bot handle
      responses:
        "200":
          description: Telegram bot information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotInfo"
  /auth/telegram:
    post:
      operationId: authenticateTelegram
      tags: [auth]
      summary: Authenticate or select a Telegram profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramAuthInput"
      responses:
        "200":
          description: Authenticated Telegram user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/email/signup:
    post:
      operationId: signUpWithEmail
      tags: [auth]
      summary: Create an email account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailSignupInput"
      responses:
        "200":
          description: Created email account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "409":
          description: Email already registered or username already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/email/login:
    post:
      operationId: loginWithEmail
      tags: [auth]
      summary: Log in with an email account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailLoginInput"
      responses:
        "200":
          description: Authenticated email account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /me:
    get:
      operationId: getMe
      tags: [profile]
      summary: Get the current Telegram user's profile
      security: [{ telegramInitData: [] }]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      operationId: updateMe
      tags: [profile]
      summary: Update the current user's profile
      security: [{ telegramInitData: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdateInput"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /community/me:
    get:
      operationId: getMyCommunities
      tags: [community]
      summary: List Telegram groups where the current user has Community XP
      security: [{ telegramInitData: [] }]
      responses:
        "200":
          description: User's group memberships and Community XP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyCommunitiesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /community/{chatId}:
    get:
      operationId: getCommunityDetails
      tags: [community]
      summary: Get the current user's group reputation, leaderboard, and history
      security: [{ telegramInitData: [] }]
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: string
            pattern: "^-?[0-9]{1,20}$"
      responses:
        "200":
          description: Group-scoped reputation details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityDetails"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /experiences:
    get:
      operationId: listExperiences
      tags: [experiences]
      summary: Discover published volunteering experiences
      security: [{ telegramInitData: [] }]
      parameters:
        - $ref: "#/components/parameters/Category"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/AvailableOnly"
      responses:
        "200":
          description: Published experiences
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Experience"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createExperience
      tags: [host]
      summary: Publish a volunteering experience for the current organisation
      security: [{ telegramInitData: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExperienceCreateInput"
      responses:
        "201":
          description: Published experience
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Experience"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /experiences/{experienceId}:
    get:
      operationId: getExperience
      tags: [experiences]
      summary: Get experience details
      security: [{ telegramInitData: [] }]
      parameters:
        - $ref: "#/components/parameters/ExperienceId"
      responses:
        "200":
          description: Experience details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperienceDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /experiences/{experienceId}/join:
    post:
      operationId: joinExperience
      tags: [experiences]
      summary: Join a published experience
      security: [{ telegramInitData: [] }]
      parameters:
        - $ref: "#/components/parameters/ExperienceId"
      responses:
        "201":
          description: Participation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Participation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Cannot join this experience
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /participations:
    get:
      operationId: listMyParticipations
      tags: [experiences]
      summary: List the current user's participation history
      security: [{ telegramInitData: [] }]
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [upcoming, completed]
      responses:
        "200":
          description: Participation history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Participation"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /participations/{participationId}/submit:
    post:
      operationId: submitCompletion
      tags: [experiences]
      summary: Submit a completed experience for host verification
      security: [{ telegramInitData: [] }]
      parameters:
        - $ref: "#/components/parameters/ParticipationId"
      responses:
        "200":
          description: Updated participation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Participation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /host/overview:
    get:
      operationId: getHostOverview
      tags: [host]
      summary: Get organisation activity summary
      security: [{ telegramInitData: [] }]
      responses:
        "200":
          description: Host overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostOverview"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /host/experiences:
    get:
      operationId: listHostExperiences
      tags: [host]
      summary: List experiences owned by the current host
      security: [{ telegramInitData: [] }]
      responses:
        "200":
          description: Host experiences
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Experience"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /host/experiences/{experienceId}/participants:
    get:
      operationId: listExperienceParticipants
      tags: [host]
      summary: List participants for a hosted experience
      security: [{ telegramInitData: [] }]
      parameters:
        - $ref: "#/components/parameters/ExperienceId"
      responses:
        "200":
          description: Participants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Participation"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /host/participations/{participationId}/attend:
    post:
      operationId: markAttendance
      tags: [host]
      summary: Mark a participant as attended
      security: [{ telegramInitData: [] }]
      parameters:
        - $ref: "#/components/parameters/ParticipationId"
      responses:
        "200":
          description: Updated participation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Participation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /host/participations/{participationId}/verify:
    post:
      operationId: verifyParticipation
      tags: [host]
      summary: Verify a participant's submitted completion
      security: [{ telegramInitData: [] }]
      parameters:
        - $ref: "#/components/parameters/ParticipationId"
      responses:
        "200":
          description: Verified participation and issued reward
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Participation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /host/participations/{participationId}/reject:
    post:
      operationId: rejectParticipation
      tags: [host]
      summary: Reject a submitted completion
      security: [{ telegramInitData: [] }]
      parameters:
        - $ref: "#/components/parameters/ParticipationId"
      responses:
        "200":
          description: Rejected participation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Participation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /friends:
    get:
      operationId: listFriends
      tags: [friends]
      summary: List accepted friends
      security: [{ telegramInitData: [] }]
      responses:
        "200":
          description: Friends
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Friend"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /friends/{friendId}/profile:
    get:
      operationId: getFriendProfile
      tags: [friends]
      summary: Get the profile of an accepted friend
      security: [{ telegramInitData: [] }]
      parameters:
        - name: friendId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Friend profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /friends/requests:
    get:
      operationId: listFriendRequests
      tags: [friends]
      summary: List incoming friend requests
      security: [{ telegramInitData: [] }]
      responses:
        "200":
          description: Pending requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FriendRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createFriendRequest
      tags: [friends]
      summary: Send a friend request by Telegram username
      security: [{ telegramInitData: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FriendRequestCreateInput"
      responses:
        "201":
          description: Friend request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /friends/requests/sent:
    get:
      operationId: listSentFriendRequests
      tags: [friends]
      summary: List sent friend requests
      security: [{ telegramInitData: [] }]
      responses:
        "200":
          description: Sent pending requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FriendRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /friends/requests/{requestId}/accept:
    post:
      operationId: acceptFriendRequest
      tags: [friends]
      summary: Accept a friend request
      security: [{ telegramInitData: [] }]
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Accepted friend request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /friends/requests/{requestId}/decline:
    post:
      operationId: declineFriendRequest
      tags: [friends]
      summary: Decline a friend request
      security: [{ telegramInitData: [] }]
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Declined friend request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /accountability:
    get:
      operationId: getAccountabilityDashboard
      tags: [friends]
      summary: Get the signed-in participant's accountability dashboard
      security: [{ telegramInitData: [] }]
      responses:
        "200":
          description: Accountability dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountabilityDashboard"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /accountability/invitations:
    post:
      operationId: createAccountabilityInvitation
      tags: [friends]
      summary: Invite an accepted friend to become an accountability partner
      security: [{ telegramInitData: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountabilityInvitationInput"
      responses:
        "201":
          description: Accountability invitation sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountabilityMutationResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /accountability/invitations/{invitationId}/accept:
    post:
      operationId: acceptAccountabilityInvitation
      tags: [friends]
      summary: Accept an accountability partnership invitation
      security: [{ telegramInitData: [] }]
      parameters:
        - $ref: "#/components/parameters/AccountabilityInvitationId"
      responses:
        "200":
          description: Partnership activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountabilityMutationResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /accountability/invitations/{invitationId}/decline:
    post:
      operationId: declineAccountabilityInvitation
      tags: [friends]
      summary: Decline an accountability partnership invitation
      security: [{ telegramInitData: [] }]
      parameters:
        - $ref: "#/components/parameters/AccountabilityInvitationId"
      responses:
        "200":
          description: Invitation declined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountabilityMutationResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /accountability/partnerships/{partnershipId}/end:
    post:
      operationId: endAccountabilityPartnership
      tags: [friends]
      summary: End the signed-in participant's active partnership
      security: [{ telegramInitData: [] }]
      parameters:
        - $ref: "#/components/parameters/AccountabilityPartnershipId"
      responses:
        "200":
          description: Partnership ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountabilityMutationResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /accountability/commitments:
    post:
      operationId: createAccountabilityCommitment
      tags: [friends]
      summary: Create a shared commitment for an active partnership
      security: [{ telegramInitData: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountabilityCommitmentInput"
      responses:
        "201":
          description: Shared commitment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountabilityCommitment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /accountability/commitments/{commitmentId}/check-ins:
    post:
      operationId: createAccountabilityCheckIn
      tags: [friends]
      summary: Record a self-reported commitment check-in
      security: [{ telegramInitData: [] }]
      parameters:
        - $ref: "#/components/parameters/AccountabilityCommitmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountabilityCheckInInput"
      responses:
        "201":
          description: Check-in recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountabilityCheckIn"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /accountability/check-ins/{checkInId}/confirm:
    post:
      operationId: confirmAccountabilityCheckIn
      tags: [friends]
      summary: Confirm a partner's self-reported completion
      security: [{ telegramInitData: [] }]
      parameters:
        - $ref: "#/components/parameters/AccountabilityCheckInId"
      responses:
        "200":
          description: Check-in confirmed by partner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountabilityCheckIn"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /accountability/encouragement:
    post:
      operationId: sendAccountabilityEncouragement
      tags: [friends]
      summary: Send a prewritten encouragement to the active partner
      security: [{ telegramInitData: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountabilityEncouragementInput"
      responses:
        "201":
          description: Encouragement sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountabilityMutationResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /accountability/notifications/{notificationId}/read:
    patch:
      operationId: markAccountabilityNotificationRead
      tags: [friends]
      summary: Mark an accountability notification as read
      security: [{ telegramInitData: [] }]
      parameters:
        - $ref: "#/components/parameters/AccountabilityNotificationId"
      responses:
        "200":
          description: Notification marked read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountabilityMutationResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    telegramInitData:
      type: http
      scheme: bearer
      bearerFormat: TelegramWebAppInitData
  parameters:
    ExperienceId:
      name: experienceId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ParticipationId:
      name: participationId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    AccountabilityInvitationId:
      name: invitationId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    AccountabilityPartnershipId:
      name: partnershipId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    AccountabilityCommitmentId:
      name: commitmentId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    AccountabilityCheckInId:
      name: checkInId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    AccountabilityNotificationId:
      name: notificationId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    Category:
      name: category
      in: query
      schema:
        $ref: "#/components/schemas/ExperienceCategory"
    Search:
      name: search
      in: query
      schema:
        type: string
    AvailableOnly:
      name: availableOnly
      in: query
      schema:
        type: boolean
  responses:
    Unauthorized:
      description: Telegram identity is missing or invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Action cannot be completed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      properties:
        message:
          type: string
      required: [message]
    BotInfo:
      type: object
      properties:
        username:
          type: [string, "null"]
      required: [username]
    TelegramAuthInput:
      type: object
      properties:
        initData:
          type: string
          minLength: 1
          description: Signed Telegram Mini App data or a valid profile-bound Telegram session.
        userType:
          $ref: "#/components/schemas/UserType"
      required: [initData]
    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        isNew:
          type: boolean
        sessionToken:
          type: string
          minLength: 1
      required: [user, isNew, sessionToken]
    EmailSignupInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        username:
          type: string
          minLength: 5
          maxLength: 32
          pattern: "^[a-z0-9_]{5,32}$"
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        userType:
          $ref: "#/components/schemas/UserType"
      required: [name, username, email, password, userType]
    EmailLoginInput:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
      required: [email, password]
    ExperienceCategory:
      type: string
      enum: [environmental, education, community]
    ParticipationType:
      type: string
      enum: [join, host, both]
    UserType:
      type: string
      enum: [participant, organisation]
    ExperienceStatus:
      type: string
      enum: [published, full, completed, archived]
    ParticipationStatus:
      type: string
      enum: [joined, attended, submitted, verified, rejected]
    RewardStatus:
      type: string
      enum: [pending, issued]
    User:
      type: object
      properties:
        id:
          type: integer
