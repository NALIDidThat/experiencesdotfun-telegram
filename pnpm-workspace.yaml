  # drizzle-kit uses esbuild internally on an older version that's vulnerable, this overrides it
  "@esbuild-kit/esm-loader": "npm:tsx@^4.21.0"
  esbuild: "0.28.2"
  # orval pins js-yaml to an exact version older than the CVE fix (>=4.3.2)
  js-yaml: '4.3.2'
  # Express 5 accepts the patched 2.0.8 release for GHSA-jqcg-44mw-7w3h.
  proxy-addr: "2.0.8"
  # xcode has no newer release; uuid 11 preserves its CommonJS API and fixes GHSA-w5hq-g745-h8pq.
  "xcode>uuid": "11.1.1"
  # query-string v7 expects a CommonJS callable; unwrap the ESM decoder's default export via the package patch.
  "query-string>decode-uri-component": "0.5.0"
  # Fix all three brace-expansion advisories while preserving older major APIs.
  "brace-expansion@>=4.0.0 <5.0.12": "5.0.12"
  # Keep AJV's 3.x URI API while fixing GHSA-hrr3-gc8f-f4qj.
  "fast-uri@>=3.0.0 <3.1.8": "3.1.8"
  # Additional patched versions selected by pnpm audit --fix.
  "source-map-js@>=1.0.0 <1.2.2": ">=1.2.2"
  "shell-quote@>=1.8.4 <1.11.0": ">=1.11.0"
patchedDependencies:
  query-string@7.1.3: patches/query-string@7.1.3.patch
  # No official patched release exists; backport digitalbazaar/forge#1152.
  node-forge@1.4.0: patches/node-forge@1.4.0.patch
  # No official fix exists for GHSA-vfj7-8cjw-p6xm; bound brace AST nesting.
  braces@3.0.3: patches/braces@3.0.3.patch
